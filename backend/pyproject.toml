[project]
name = "hscredit-studio"
version = "0.1.0"
description = "HSCredit Studio 后端 — 基于 hscredit 的多租户 SaaS 评分卡建模系统"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.14"
authors = [
    { name = "HSCredit Team", email = "dev@hscredit.example.com" },
]
keywords = ["credit", "risk", "scorecard", "workflow", "multi-tenant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Office/Business :: Financial",
]

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.25",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    "celery[redis]>=5.3.6",
    "redis>=5.0.1",
    "aiobotocore[boto3]>=2.5.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "httpx>=0.26.0",
    "orjson>=3.9.0",
    "structlog>=24.1.0",
    "prometheus-client>=0.20.0",
    "opentelemetry-api>=1.23.0",
    "opentelemetry-sdk>=1.23.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.23.0",
    "opentelemetry-instrumentation-fastapi>=0.44b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.44b0",
    "opentelemetry-instrumentation-celery>=0.44b0",
    "opentelemetry-instrumentation-redis>=0.44b0",
    # hscredit 核心库（本地路径安装，避免 PyPI 找不到 0.1.2）
    "hscredit",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-benchmark>=4.0.0",
    "testcontainers[postgres,redis,minio]>=4.4.0",
    "httpx>=0.26.0",
    "ruff>=0.3.0",
    "black>=24.0.0",
    "mypy>=1.8.0",
    "types-redis",
    "types-python-jose",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "testcontainers[postgres,redis,minio]>=4.4.0",
]
boost = [
    "xgboost>=2.0.0",
    "lightgbm>=4.3.0",
    "catboost>=1.2.0",
]

[project.urls]
Homepage = "https://github.com/City365/HSCredit-Studio"
Documentation = "https://docs.hscredit.com"
Issues = "https://github.com/City365/HSCredit-Studio/issues"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hscredit_studio"]

[tool.uv.sources]
hscredit = { path = "../../hscredit", editable = true }

[tool.black]
line-length = 120
target-version = ["py311", "py312"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
# E501: 行长度豁免，black 已保障
# B008: 默认参数调用依赖注入框架常见
# N801/N803/N805/N806/N814: 金融术语缩写 (IV / PSI / AUC / PD / LGD) 需要保持大写
# RUF001/RUF002/RUF003: 中文项目，docstring/string/comment 中全角符号为预期行为
extend-ignore = ["E501", "B008", "N801", "N803", "N805", "N806", "N814", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --tb=short"
testpaths = ["tests"]
markers = [
    "unit: 单元测试",
    "integration: 集成测试（需 Docker）",
    "e2e: 端到端测试",
    "slow: 慢速测试",
]
asyncio_mode = "auto"
