apiVersion: v1
kind: Service
metadata:
  name: {{ include "hscredit-studio.fullname" . }}-api
  labels:
    {{- include "hscredit-studio.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 8000
      targetPort: http
      protocol: TCP
  selector:
    {{- include "hscredit-studio.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
