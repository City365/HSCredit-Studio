apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hscredit-studio.fullname" . }}-config
  labels:
    {{- include "hscredit-studio.labels" . | nindent 4 }}
data:
  ENVIRONMENT: {{ .Values.env.ENVIRONMENT | default "production" }}
  LOG_LEVEL: {{ .Values.env.LOG_LEVEL | default "INFO" }}
  CORS_ALLOWED_ORIGINS: {{ .Values.env.CORS_ALLOWED_ORIGINS | default "" }}
  RATE_LIMIT_PER_TENANT: {{ .Values.env.RATE_LIMIT_PER_TENANT | default "1000" }}
  OTEL_SERVICE_NAME: "{{ include "hscredit-studio.fullname" . }}"
