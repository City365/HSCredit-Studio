# Prometheus 全局配置
# @see docs/design/13-observability.md

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: hscredit-prod
    monitor: hscredit

# 告警管理器
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

# 规则文件
rule_files:
  - "alerts/*.yml"
  - "rules/*.yml"

# 抓取配置
scrape_configs:
  # Prometheus 自身
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # HSCredit API
  - job_name: hscredit-api
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
        regex: api
        action: keep
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        target_label: __address__
        regex: ([^:]+)(?::\d+)?
        replacement: ${1}:8000

  # Celery Workers
  - job_name: hscredit-workers
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
        regex: worker
        action: keep
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        target_label: __address__
        regex: ([^:]+)(?::\d+)?

  # K8s 组件
  - job_name: kubernetes-apiservers
    kubernetes_sd_configs:
      - role: endpoints

  - job_name: kubernetes-nodes
    kubernetes_sd_configs:
      - role: node
